# partidata.se — static Next.js export rsynced to /var/www/partidata.se by
# GitHub Actions. Apex redirects to www. Run certbot --nginx after DNS points
# here; it adds the TLS blocks itself.

server {
    listen 80;
    listen [::]:80;
    server_name partidata.se;
    return 301 https://www.partidata.se$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.partidata.se;

    root /var/www/partidata.se;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
