# partidata.se — static Next.js export rsynced to the production web root by
# GitHub Actions. Apex redirects to www. TLS blocks are managed by
# certbot --nginx; this is the live file.

server {
    server_name partidata.se;
    return 301 https://www.partidata.se$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/partidata.se/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/partidata.se/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name www.partidata.se;

    root /srv/partidata/current;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/partidata.se/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/partidata.se/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = partidata.se) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name partidata.se;
    return 404; # managed by Certbot


}

server {
    if ($host = www.partidata.se) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.partidata.se;
    return 404; # managed by Certbot


}
