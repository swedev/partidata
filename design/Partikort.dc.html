<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div tabindex="0" role="link" onClick="{{ onOpen }}" onKeyDown="{{ onKey }}" style="cursor:pointer;background:#FFFDF8;border:1px solid #DFDBCD;border-radius:{{ radius }};padding:{{ pad }};display:flex;flex-direction:column;gap:{{ gap }};height:100%;font-family:'Hanken Grotesk',Helvetica,sans-serif;color:#1A1A19;transition:border-color .12s,box-shadow .12s" style-hover="border-color:#082354;box-shadow:0 1px 0 #DFDBCD">

  <sc-if value="{{ hasLogo }}">
    <div role="img" aria-label="{{ name }}" style="width:100%;max-width:{{ logoW }};height:{{ logoH }};background-image:url({{ logo }});background-size:contain;background-position:left center;background-repeat:no-repeat"></div>
  </sc-if>

  <sc-if value="{{ noLogo }}">
    <div aria-hidden="true" style="height:{{ logoH }};display:flex;align-items:center">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:{{ abbrSize }};letter-spacing:.04em;color:#082354;border:1.5px solid #C3CDDE;border-radius:4px;padding:{{ abbrPad }}">{{ abbr }}</span>
    </div>
  </sc-if>

  <div style="display:flex;flex-direction:column;gap:6px;margin-top:auto">
    <div style="font-size:{{ nameSize }};font-weight:600;line-height:1.25;letter-spacing:-.012em;text-wrap:pretty">{{ name }}</div>
    <sc-if value="{{ hasSub }}">
      <div style="font-size:{{ metaSize }};color:#45453F;line-height:1.4">{{ sub }}</div>
    </sc-if>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #E6E2D6;padding-top:{{ footPad }}">
    <span style="font-size:{{ metaSize }};color:#2A2A26;font-weight:500">{{ meta }}</span>
    <i data-lucide="arrow-up-right" aria-hidden="true" style="width:{{ iconSize }};height:{{ iconSize }};color:#082354;flex:none"></i>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:220},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;md&quot;,&quot;options&quot;:[&quot;lg&quot;,&quot;md&quot;,&quot;sm&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;partyName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Socialdemokraterna&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;abbr&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;S&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;logo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;107 mandat&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const SIZES = {
  lg: { pad: '26px 24px 22px', gap: '22px', logoW: '210px', logoH: '42px', nameSize: '21px', metaSize: '17px', abbrSize: '17px', abbrPad: '6px 12px', footPad: '16px', iconSize: '20px', radius: '12px' },
  md: { pad: '20px', gap: '16px', logoW: '160px', logoH: '30px', nameSize: '17px', metaSize: '15px', abbrSize: '14px', abbrPad: '5px 10px', footPad: '13px', iconSize: '17px', radius: '10px' },
  sm: { pad: '16px 16px 14px', gap: '12px', logoW: '128px', logoH: '24px', nameSize: '16px', metaSize: '14px', abbrSize: '12.5px', abbrPad: '4px 8px', footPad: '11px', iconSize: '15px', radius: '10px' }
};

class Component extends DCLogic {
  icons() { if (window.lucide) window.lucide.createIcons(); }
  componentDidMount() { this.icons(); }
  componentDidUpdate() { this.icons(); }
  renderVals() {
    const p = this.props;
    const s = SIZES[p.size] || SIZES.md;
    const open = () => { if (p.onOpen) p.onOpen(); };
    return Object.assign({}, s, {
      name: p.partyName ?? p.name, abbr: p.abbr, logo: p.logo, meta: p.meta, sub: p.sub,
      hasLogo: !!p.logo, noLogo: !p.logo, hasSub: !!p.sub,
      onOpen: open,
      onKey: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } }
    });
  }
}

</script>
</body>
</html>
