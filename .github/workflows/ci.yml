name: Integrate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: integrate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
